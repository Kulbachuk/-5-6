<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Каталог книг{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        nav { background: #f4f4f4; padding: 10px; margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; color: #333; font-weight: bold; }
        .alert-success { background: #d4edda; color: #155724; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .alert-error { background: #f8d7da; color: #721c24; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .error { color: red; font-size: 0.9em; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; }
        .form-control { width: 100%; max-width: 400px; padding: 8px; box-sizing: border-box; }
        footer { margin-top: 40px; border-top: 1px solid #ccc; padding-top: 10px; font-size: 0.9em; color: #666; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Головна</a>
        <a href="{% url 'add_book' %}">Додати книгу</a>
    </nav>

    {% if messages %}
        {% for message in messages %}
            <div class="alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 IT Catalog (Django UI). Всі права захищено.</p>
    </footer>
</body>
</html>
