{% extends 'books/base.html' %}

{% block title %}Додати книгу{% endblock %}

{% block content %}
    <h1>Додати нову книгу</h1>
    
    <form method="post" action="{% url 'add_book' %}">
        {% csrf_token %}
        
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}:</label>
                {{ field }}
                {% if field.errors %}
                    <div class="error">
                        {% for error in field.errors %}
                            <p>{{ error }}</p>
                        {% endfor %}
                    </div>
                {% endif %}
            </div>
        {% endfor %}
        
        <button type="submit" style="padding: 8px 15px; cursor: pointer;">Зберегти</button>
    </form>
{% endblock %}
